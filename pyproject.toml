[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmem"
version = "0.1.0"
description = "Local shared conversation history and project notes for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentmem = "agentmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
